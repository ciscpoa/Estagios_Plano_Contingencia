# ==========================================================================
# render.yaml — Blueprint do Render (CISC Porto Alegre)
#
# Como usar: suba a pasta no GitHub → no Render, "New +" → "Blueprint" →
# selecione o repositório. O Render lê este arquivo e cria o serviço.
# Depois preencha ANA_IDENTIFICADOR e ANA_SENHA no painel (sync: false).
# ==========================================================================
services:
  - type: web
    name: estagios-poa-cisc
    runtime: docker            # imagem com Chromium (Selenium funciona)
    dockerfilePath: ./Dockerfile
    region: oregon
    # ATENÇÃO à memória: free e starter têm 512 MB — o Chromium (Poaclima/
    # INMET) costuma estourar esse limite. Para Selenium confiável use
    # 'standard' (2 GB). Em free/starter, defina USAR_SELENIUM=0.
    plan: standard
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      # ── Credenciais da ANA: preencher no painel do Render ──
      - key: ANA_IDENTIFICADOR
        sync: false
      - key: ANA_SENHA
        sync: false

      # ── Operação ──
      - key: TZ
        value: America/Sao_Paulo
      - key: AGENDADOR              # web service recoleta sozinho
        value: "1"
      - key: INTERVALO_COLETA_MIN   # minutos entre coletas
        value: "30"
      - key: USAR_SELENIUM          # "0" desliga Poaclima/INMET via browser
        value: "1"

      # ── Gatilhos de campo confirmados (SMS/Defesa Civil/CISC) ──
      # Alternativa ao gatilhos_manuais.txt: liste os campos separados por
      # vírgula e clique em "Save, rebuild and deploy" — sem git push.
      # Ex.: bloqueio_vias_principais,obitos_pelo_evento
      - key: GATILHOS_ATIVOS
        value: ""

      # Modo econômico do Chromium (não baixa imagens do mapa).
      # Ative se houver estouro de memória: value "1"
      - key: SELENIUM_SEM_IMAGENS
        value: "0"

      # ── Disco persistente (opcional, planos pagos) ──
      # Descomente o bloco 'disk' abaixo e esta variável para manter o
      # histórico de CSV/Excel entre deploys.
      # - key: DIRETORIO_DADOS
      #   value: /var/data

    # disk:
