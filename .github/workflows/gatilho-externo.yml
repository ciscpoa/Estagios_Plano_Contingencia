# ==========================================================================
# GATILHO EXTERNO — a única forma de garantir atualização dentro de 60 min
#
# POR QUE ESTE ARQUIVO EXISTE
# O evento `schedule` do GitHub Actions NÃO tem garantia de execução. A
# própria documentação avisa que os agendamentos podem atrasar ou ser
# descartados quando a plataforma está sob carga, e é isso que vinha
# acontecendo com o painel (intervalos de 85, 116 e 130 minutos).
#
# A solução é não depender do agendador do GitHub: um serviço de cron
# externo chama a API do repositório e dispara a coleta. Este fluxo existe
# para ser esse alvo — ele é leve, só repassa o trabalho para o `coleta.yml`.
#
# ── COMO CONFIGURAR (uma vez, ~10 minutos) ────────────────────────────────
#
# 1) CRIAR O TOKEN
#    GitHub → Settings → Developer settings → Personal access tokens →
#    Fine-grained tokens → Generate new token
#      • Repository access: apenas ciscpoa/Estagios_Plano_Contingencia
#      • Permissions → Repository permissions → Actions: Read and write
#      • Expiration: 1 ano (anote a data; quando vencer, o painel para)
#    Copie o token (só aparece uma vez).
#
# 2) TESTAR O TOKEN antes de automatizar
#    curl -X POST \
#      -H "Accept: application/vnd.github+json" \
#      -H "Authorization: Bearer SEU_TOKEN_AQUI" \
#      -H "X-GitHub-Api-Version: 2022-11-28" \
#      https://api.github.com/repos/ciscpoa/Estagios_Plano_Contingencia/actions/workflows/gatilho-externo.yml/dispatches \
#      -d '{"ref":"main"}'
#    Resposta esperada: HTTP 204 sem corpo. Confira na aba Actions se rodou.
#    (Se o branch padrão não for `main`, troque no -d.)
#
# 3) AGENDAR NO SERVIÇO EXTERNO — https://cron-job.org (gratuito)
#      • URL      : a mesma do curl acima
#      • Método   : POST
#      • Execução : a cada 30 minutos
#      • Headers  : Accept: application/vnd.github+json
#                   Authorization: Bearer SEU_TOKEN_AQUI
#                   X-GitHub-Api-Version: 2022-11-28
#      • Body     : {"ref":"main"}
#    Ative as notificações de falha: se o token vencer, você fica sabendo.
#
# 4) O cron do `coleta.yml` pode continuar ligado. Os dois se complementam,
#    e a trava de idade abaixo impede que rodem em duplicidade.
# ==========================================================================
name: Coleta por gatilho externo

on:
  workflow_dispatch:
    inputs:
      forcar:
        description: "Coletar mesmo se o painel estiver recente"
        type: boolean
        default: false
  repository_dispatch:
    types: [coletar]

permissions:
  contents: read

jobs:
  decidir:
    # Se o painel acabou de ser atualizado pelo cron interno, não faz sentido
    # gastar outra execução. Só dispara se o dado já tiver alguma idade.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      precisa: ${{ steps.checar.outputs.precisa }}
    steps:
      - uses: actions/checkout@v4

      - id: checar
        run: |
          python - <<'FIM' >> $GITHUB_OUTPUT
          import json, datetime, os, pathlib
          forcar = "${{ inputs.forcar }}" == "true"
          limite = 25          # min: abaixo disso o painel ainda está fresco
          idade = 999.0
          arq = pathlib.Path("dashboard/snapshot.json")
          if arq.exists():
              try:
                  iso = json.loads(arq.read_text())["timestamp_iso"]
                  idade = (datetime.datetime.now()
                           - datetime.datetime.fromisoformat(iso)).total_seconds() / 60
              except Exception:
                  pass
          precisa = forcar or idade >= limite
          print(f"precisa={'true' if precisa else 'false'}")
          resumo = (f"Painel com {idade:.0f} min. "
                    + ("Coletando." if precisa else f"Ainda fresco (< {limite} min); pulando."))
          print(resumo, file=__import__("sys").stderr)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(resumo + "\n")
          FIM

  disparar:
    needs: decidir
    if: needs.decidir.outputs.precisa == 'true'
    # Reaproveita o fluxo principal em vez de duplicar a lógica de coleta.
    uses: ./.github/workflows/coleta.yml
    permissions:
      contents: write
      pages: write
      id-token: write
    secrets: inherit
