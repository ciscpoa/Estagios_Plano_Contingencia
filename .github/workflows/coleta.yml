name: Coleta e publicação do painel

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "gatilhos_manuais.txt"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coleta-painel
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Localizar o Chrome do runner
        run: |
          CHROME=$(command -v google-chrome || command -v chromium-browser || true)
          echo "CHROME_BIN=$CHROME" >> $GITHUB_ENV
          if [ -n "$CHROMEWEBDRIVER" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then
            echo "CHROMEDRIVER_PATH=$CHROMEWEBDRIVER/chromedriver" >> $GITHUB_ENV
          fi
          echo "Chrome: ${CHROME:-nao encontrado}"

      - name: Conferir se os secrets chegaram
        run: |
          echo "ANA_IDENTIFICADOR definido: ${{ secrets.ANA_IDENTIFICADOR != '' }}"
          echo "ANA_SENHA definido: ${{ secrets.ANA_SENHA != '' }}"
          echo "INMET_TOKEN definido: ${{ secrets.INMET_TOKEN != '' }}"

      - name: Executar o pipeline
        env:
          ANA_IDENTIFICADOR: ${{ secrets.ANA_IDENTIFICADOR }}
          ANA_SENHA: ${{ secrets.ANA_SENHA }}
          INMET_TOKEN: ${{ secrets.INMET_TOKEN }}
          TZ: America/Sao_Paulo
        run: python main_pipeline.py

      - name: Gerar a página estática
        run: python -m dashboard.site_estatico

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar os dados no repositório
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/saida
          cp -r dados /tmp/saida/ 2>/dev/null || true
          cp -r arquivos_gerados_2026 /tmp/saida/ 2>/dev/null || true

          git fetch origin ${{ github.ref_name }}
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}

          cp -r /tmp/saida/dados . 2>/dev/null || true
          cp -r /tmp/saida/arquivos_gerados_2026 . 2>/dev/null || true

          git add -f dados/ultimo_snapshot.json arquivos_gerados_2026/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nada mudou nesta coleta."
          else
            git commit -m "Coleta automática [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
