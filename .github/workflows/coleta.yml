# ==========================================================================
# Coleta automática + publicação do painel (100% gratuito)
#
#   • Roda o pipeline (ANA, Open-Meteo, INMET, Poaclima com Selenium) em um
#     runner do GitHub — que tem Chrome instalado, 4 vCPU e 16 GB de RAM.
#   • Salva snapshot/CSV/Excel de volta no repositório (histórico).
#   • Publica a página estática no GitHub Pages.
#
# Repositório PÚBLICO = minutos ilimitados. Privado = 2.000 min/mês grátis
# (a cada 60 min, o consumo fica dentro da cota).
#
# ANTES DE USAR:
#   1) Settings → Secrets and variables → Actions → New repository secret:
#        ANA_IDENTIFICADOR  e  ANA_SENHA  (obrigatórios)
#        INMET_TOKEN (opcional — chuva observada da estação do INMET)
#   2) Settings → Pages → Source: "GitHub Actions"
# ==========================================================================
name: Coleta e publicação do painel

on:
  schedule:
    # Três execuções por hora, em minutos "quebrados" (:00 e :30 são os mais
    # disputados do agendador do GitHub e os que mais sofrem descarte).
    # Com 3 tentativas/hora, mesmo perdendo 2 o painel fica dentro de 60 min.
    # O espaçamento de 20 min é maior que o teto de 18 min do job, então uma
    # execução nunca atropela a seguinte.
    - cron: "4,24,44 * * * *"
  workflow_dispatch:             # permite rodar na hora, pelo botão "Run workflow"
  workflow_call:                 # permite ser chamado pelo gatilho-externo.yml
  push:
    paths:
      - "gatilhos_manuais.txt"   # confirmou um gatilho? republica na hora

permissions:
  contents: write                # commitar os dados coletados
  pages: write                   # publicar no GitHub Pages
  id-token: write

concurrency:
  group: coleta-painel
  # ATENÇÃO: NÃO usar cancel-in-progress: true aqui.
  # A fila do GitHub costuma atrasar o início em 10-20 min. Com cron de 20 em
  # 20 min, a execução seguinte chegava enquanto a anterior ainda estava no
  # meio da coleta e a MATAVA — e a próxima matava aquela, e assim por diante:
  # nenhuma chegava ao fim, e o painel congelava. Com `false`, quem está em
  # andamento termina; no máximo uma fica pendente e as demais são
  # descartadas, que é exatamente o comportamento desejado.
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30          # 1ª execução pode baixar 1 ano de histórico
    steps:
      - uses: actions/checkout@v4

      - name: Idade do painel antes desta coleta
        run: |
          python - <<'FIM'
          import json, datetime, pathlib
          arq = pathlib.Path("dashboard/snapshot.json")
          if arq.exists():
              try:
                  iso = json.loads(arq.read_text())["timestamp_iso"]
                  idade = (datetime.datetime.now()
                           - datetime.datetime.fromisoformat(iso)).total_seconds() / 60
                  print(f"Última coleta bem-sucedida foi há {idade:.0f} min.")
              except Exception as exc:
                  print(f"(não foi possível ler o snapshot: {exc})")
          FIM

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Localizar o Chrome do runner (para o Selenium)
        run: |
          CHROME=$(command -v google-chrome || command -v chromium-browser || true)
          echo "CHROME_BIN=$CHROME" >> $GITHUB_ENV
          if [ -n "$CHROMEWEBDRIVER" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then
            echo "CHROMEDRIVER_PATH=$CHROMEWEBDRIVER/chromedriver" >> $GITHUB_ENV
          fi
          echo "Chrome: ${CHROME:-nao encontrado}"

      - name: Conferir se os secrets chegaram
        run: |
          echo "ANA_IDENTIFICADOR definido: ${{ secrets.ANA_IDENTIFICADOR != '' }}"
          echo "ANA_SENHA definido: ${{ secrets.ANA_SENHA != '' }}"

      - name: Diagnóstico de rede (ANA e INMET)
        continue-on-error: true
        run: |
          for host in www.ana.gov.br apitempo.inmet.gov.br apiprevmet3.inmet.gov.br; do
            echo "── $host"
            getent ahostsv4 $host | head -1 || echo "  (sem IPv4)"
            curl -s -o /dev/null -w "  IPv4 HTTP %{http_code} em %{time_total}s\n" \
                 --ipv4 --max-time 20 "https://$host/" || echo "  IPv4 FALHOU"
          done

      - name: Executar o pipeline (coleta + classificação)
        timeout-minutes: 23       # inclui bootstrap histórico em blocos de 30 dias
        continue-on-error: true   # falha parcial não pode impedir a publicação
        id: pipeline
        env:
          ANA_IDENTIFICADOR: ${{ secrets.ANA_IDENTIFICADOR }}
          ANA_SENHA: ${{ secrets.ANA_SENHA }}
          INMET_TOKEN: ${{ secrets.INMET_TOKEN }}
          TZ: America/Sao_Paulo
        run: python main_pipeline.py

      - name: Gerar a página estática
        if: always()
        run: python -m dashboard.site_estatico

      # A página é publicada ANTES do commit: assim um problema no git
      # nunca impede a atualização do painel.
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

      # Commit dos dados coletados. Sem rebase (que dava CONFLITO no
      # ultimo_snapshot.json): pegamos o estado do remoto e regravamos os
      # arquivos gerados por cima — a coleta mais recente sempre vence.
      - name: Publicar os dados no repositório
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/saida
          cp -r dados /tmp/saida/ 2>/dev/null || true
          cp -r arquivos_gerados_2026 /tmp/saida/ 2>/dev/null || true

          git fetch origin ${{ github.ref_name }}
          git checkout -B ${{ github.ref_name }} origin/${{ github.ref_name }}

          cp -r /tmp/saida/dados . 2>/dev/null || true
          cp -r /tmp/saida/arquivos_gerados_2026 . 2>/dev/null || true

          git add -f dados/ultimo_snapshot.json dados/historico_niveis_ana.csv \
            arquivos_gerados_2026/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nada mudou nesta coleta."
          else
            git commit -m "Coleta automática [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Conferir a idade do painel
        if: always()
        run: |
          python - <<'FIM'
          import json, datetime, os, pathlib
          arq = pathlib.Path("dashboard/snapshot.json")
          if not arq.exists():
              raise SystemExit(0)
          try:
              iso = json.loads(arq.read_text())["timestamp_iso"]
          except Exception:
              raise SystemExit(0)
          idade = (datetime.datetime.now()
                   - datetime.datetime.fromisoformat(iso)).total_seconds() / 60
          print(f"Painel com {idade:.0f} min desde a coleta.")
          if idade > 60:
              print(f"::warning::Painel com {idade:.0f} min sem atualizar "
                    "(teto acordado: 60 min). Provável descarte do agendador "
                    "do GitHub — considere o gatilho externo.")
          FIM

      - name: Sinalizar falha do pipeline (após publicar)
        if: always() && steps.pipeline.outcome == 'failure'
        run: |
          echo "::warning::O pipeline falhou; o painel foi publicado com o "\
               "último snapshot disponível. Veja o log acima."

  publicar:
    needs: coletar
    if: always() && needs.coletar.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
